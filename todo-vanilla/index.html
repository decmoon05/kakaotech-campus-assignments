<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <button id="prev-day" class="nav-btn" aria-label="이전 날짜">‹</button>
      <h1 id="current-date" class="current-date"></h1>
      <button id="next-day" class="nav-btn" aria-label="다음 날짜">›</button>
    </header>

    <section class="week">
      <div class="week-nav">
        <button id="prev-week" class="nav-btn-sm">‹ 이전 주</button>
        <button id="next-week" class="nav-btn-sm">다음 주 ›</button>
      </div>
      <ul id="week-days" class="week-days"></ul>
    </section>

    <form id="todo-form" class="todo-form">
      <input
        id="todo-input"
        type="text"
        class="todo-input"
        placeholder="할 일을 입력하세요"
        autocomplete="off"
      >
      <button type="submit" class="add-btn">추가</button>
    </form>

    <p id="message" class="message" role="alert"></p>

    <nav class="filters">
      <button class="filter-btn active" data-filter="all">전체</button>
      <button class="filter-btn" data-filter="active">진행 중</button>
      <button class="filter-btn" data-filter="done">완료</button>
    </nav>

    <ul id="todo-list" class="todo-list"></ul>

    <p id="empty-text" class="empty-text">오늘 할 일이 없어요</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
